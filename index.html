<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>공유 쿠폰함</title>
  <!-- OCR, 아이콘, Pretendard 폰트 (새 바코드 생성 라이브러리 완전 삭제) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    body { background-color: #fdf8f5; color: #3b3030; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* 비밀번호 잠금 화면 */
    #authOverlay {
      position: fixed; inset: 0; background-color: #fdf8f5; z-index: 999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
    }
    .auth-box {
      background: #ffffff; border: 2px solid #4a3e3d; border-radius: 14px;
      padding: 28px 24px; width: 100%; max-width: 320px; text-align: center;
      box-shadow: 0 6px 16px rgba(74, 62, 61, 0.1);
    }
    .auth-title { font-size: 20px; font-weight: 800; color: #4a3e3d; margin-bottom: 16px; }
    .auth-input {
      width: 100%; padding: 14px; font-size: 22px; text-align: center; letter-spacing: 8px;
      border: 2px solid #d4c5c2; border-radius: 10px; margin-bottom: 18px; outline: none; background: #faf5f2;
    }
    .auth-input:focus { border-color: #4a3e3d; }
    .auth-btn {
      width: 100%; padding: 14px; background: #4a3e3d; color: #fff; border: none;
      border-radius: 10px; font-size: 17px; font-weight: 800; cursor: pointer;
    }

    /* 상단 헤더 */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px; border-bottom: 2px solid #4a3e3d; background-color: #fdf8f5;
    }
    .header-btn { background: none; border: none; font-size: 30px; color: #4a3e3d; cursor: pointer; display: flex; align-items: center; }
    .header-title { font-size: 20px; font-weight: 800; color: #4a3e3d; }

    /* 메인 3열 그리드 */
    main {
      flex: 1; overflow-y: auto; padding: 16px 10px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-content: start;
    }

    /* 쿠폰 카드 */
    .coupon-card {
      position: relative; background: #ffffff; border: 2px solid #4a3e3d; border-radius: 10px;
      padding: 6px; display: flex; flex-direction: column; cursor: pointer;
      box-shadow: 0 3px 8px rgba(74, 62, 61, 0.08); aspect-ratio: 1 / 1.58;
    }
    .card-img-box {
      position: relative; flex: 1; border: 1.5px solid #ece2de; border-radius: 6px; overflow: hidden;
      display: flex; align-items: center; justify-content: center; background: #fbf5f2;
    }
    .card-img-box img { width: 100%; height: 100%; object-fit: cover; }
    
    .card-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 7px; gap: 4px; min-height: 28px;
    }
    
    .badge-date {
      background-color: transparent; 
      border: 1.8px solid #4a3e3d; 
      color: #4a3e3d;
      font-size: 12px; 
      font-weight: 800; 
      padding: 3px 2px; 
      border-radius: 6px; 
      flex: 1; 
      text-align: center; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis;
      letter-spacing: -0.3px;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }
    
    .badge-date.urgent-dday {
      background-color: #d9381e; 
      border: 1.8px solid #d9381e; 
      color: #ffffff;
      font-size: 13px; 
      font-weight: 900; 
      letter-spacing: 0px;
      box-shadow: 0 2px 5px rgba(217, 56, 30, 0.3);
    }

    /* 쓰레기통 카드 스타일 */
    .coupon-card.used {
      border-color: #c9bcba; background: #f5eeea; cursor: default;
    }
    .coupon-card.used .card-img-box img {
      filter: grayscale(100%) opacity(0.3);
    }
    
    .badge-date-trash {
      background-color: #e0d0cc; 
      border: 1.5px solid #a89491; 
      color: #705856;
      font-size: 11px; 
      font-weight: 800; 
      padding: 4px 2px; 
      border-radius: 6px; 
      flex: 1; 
      text-align: center; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.15s;
    }
    .badge-date-trash:active {
      background-color: #d9381e;
      border-color: #d9381e;
      color: #fff;
    }

    .masking-tape {
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(100% * 1.62);
      height: 36px;
      transform: translate(-50%, -50%) rotate(-51.5deg);
      background: rgba(248, 230, 222, 0.95);
      border: none;
      clip-path: polygon(
        0% 0%, 98% 0%,
        100% 7%, 97% 15%, 99% 23%, 96.5% 31%, 100% 40%, 97% 49%, 99.5% 58%, 96.5% 67%, 100% 76%, 97.5% 85%, 99% 93%, 97% 100%,
        0% 100%,
        2.5% 93%, 0.5% 85%, 3% 76%, 0% 67%, 3% 58%, 0.5% 49%, 3% 40%, 0% 31%, 2.5% 23%, 0.5% 15%, 3% 7%
      );
      color: #3b2827;
      font-size: 13px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.3px;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 3px 8px rgba(74, 62, 61, 0.15);
      z-index: 10;
    }

    .btn-restore {
      background: #6e5e5d; color: #fff; border: 1.5px solid #6e5e5d;
      font-size: 11px; font-weight: 800; padding: 4px 6px;
      border-radius: 6px; cursor: pointer; white-space: nowrap;
    }
    .btn-restore:active { background: #4a3e3d; }

    /* 모달: 사진 자체 풀스크린 뷰어 */
    .modal {
      display: none; position: fixed; inset: 0; 
      background: #000000;
      z-index: 100; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 0;
    }
    .modal.active { display: flex; }
    
    .photo-viewport {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #000000;
    }

    /* 🌟 사용자가 올린 실제 사진 엘리먼트 (트랜스폼으로만 줌인) */
    #modalPhoto {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transform-origin: center center;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }
    
    .btn-close-pure-x {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,0.55); border: none; padding: 10px 14px;
      border-radius: 50%;
      cursor: pointer; color: #ffffff; font-size: 28px; font-weight: 900;
      z-index: 120; display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }

    .modal-bottom-actions {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: calc(100% - 32px);
      max-width: 360px;
      z-index: 120;
    }
    
    .btn-toggle-view {
      width: 100%;
      padding: 13px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.4);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      background: rgba(42, 157, 143, 0.95);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
    }
    
    .btn-use-small {
      width: 100%;
      padding: 13px 34px; border: none; border-radius: 24px;
      font-size: 16px; font-weight: 800; cursor: pointer;
      background: rgba(74, 62, 61, 0.95); color: #fff; 
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(6px);
    }

    /* 쓰레기통 3열 뷰 */
    .trash-view {
      display: none; position: fixed; inset: 0; background: #fdf8f5; z-index: 90;
      flex-direction: column;
    }
    .trash-view.active { display: flex; }
    .trash-grid {
      flex: 1; overflow-y: auto; padding: 16px 10px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-content: start;
    }

    /* 영구 삭제 확인 팝업 모달 */
    .confirm-modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65);
      display: none; justify-content: center; align-items: center;
      z-index: 999; padding: 20px;
    }
    .confirm-modal-overlay.active { display: flex; }
    .confirm-card {
      background: #ffffff; border: 2px solid #4a3e3d; border-radius: 16px;
      padding: 24px 20px; width: 100%; max-width: 300px; text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    .confirm-title { font-size: 18px; font-weight: 900; color: #d9381e; margin-bottom: 8px; }
    .confirm-desc { font-size: 14px; font-weight: 700; color: #5a4b4a; margin-bottom: 20px; line-height: 1.4; }
    .confirm-btn-group { display: flex; gap: 8px; }
    .btn-confirm-yes {
      flex: 1; padding: 12px; background: #d9381e; color: #fff;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 900; cursor: pointer;
    }
    .btn-confirm-no {
      flex: 1; padding: 12px; background: #ebe2df; color: #4a3e3d;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer;
    }

    #loading {
      display: none; position: fixed; inset: 0; background: rgba(253, 248, 245, 0.92);
      z-index: 200; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; color: #4a3e3d; font-size: 17px;
    }
  </style>
</head>
<body>

  <!-- 비밀번호 잠금 화면 -->
  <div id="authOverlay">
    <div class="auth-box">
      <div class="auth-title"><i class="fa-solid fa-lock"></i> 공유 쿠폰함 비밀번호</div>
      <input type="password" id="pinInput" class="auth-input" maxlength="8" placeholder="••••" />
      <button class="auth-btn" onclick="checkPin()">입장하기</button>
    </div>
  </div>

  <!-- 상단 네비게이션 -->
  <header>
    <button class="header-btn" id="trashBtn" title="사용 완료함">
      <i class="fa-regular fa-trash-can"></i>
    </button>
    <span class="header-title">쿠폰함</span>
    <label class="header-btn" title="쿠폰 추가">
      <i class="fa-solid fa-plus"></i>
      <input type="file" id="fileInput" accept="image/*" multiple style="display: none;" />
    </label>
  </header>

  <!-- 메인 쿠폰 목록 (3열) -->
  <main id="couponGrid"></main>

  <!-- 바코드 / 원본 사진 자체 줌인 모달 -->
  <div class="modal" id="detailModal">
    <button class="btn-close-pure-x" onclick="closeModal()" aria-label="닫기">
      <i class="fa-solid fa-xmark"></i>
    </button>
    
    <!-- 사진 뷰포트 (오직 원본 사진 하나만 들어감) -->
    <div class="photo-viewport" id="photoViewport">
      <img id="modalPhoto" src="" alt="쿠폰 사진" />
    </div>

    <div class="modal-bottom-actions">
      <button class="btn-toggle-view" id="btnToggleView" onclick="toggleZoom()">
        <i class="fa-solid fa-image"></i> 원본 전체 보기
      </button>
      <button class="btn-use-small" id="useCompleteBtn">사용완료</button>
    </div>
  </div>

  <!-- 사용 완료함 3열 뷰 -->
  <div class="trash-view" id="trashView">
    <header>
      <button class="header-btn" onclick="toggleTrashView()"><i class="fa-solid fa-arrow-left"></i></button>
      <span class="header-title">사용완료함</span>
      <div style="width: 30px;"></div>
    </header>
    <div style="padding: 10px 14px 0; font-size: 12px; color: #8a7c7a; text-align: center;">
      💡 사용완료된 쿠폰은 30일 후 자동 삭제되며,<br>날짜 버튼을 누르면 <b>즉시 영구 삭제</b>할 수 있습니다.
    </div>
    <div class="trash-grid" id="trashGrid"></div>
  </div>

  <!-- 영구 삭제 확인 팝업 모달 -->
  <div class="confirm-modal-overlay" id="confirmDeleteModal">
    <div class="confirm-card">
      <div class="confirm-title"><i class="fa-solid fa-triangle-exclamation"></i> 영구 삭제</div>
      <div class="confirm-desc">이 쿠폰을 정말 영구 삭제하시겠습니까?<br><span style="font-size:12px; color:#8a7c7a;">삭제 후에는 복구할 수 없습니다.</span></div>
      <div class="confirm-btn-group">
        <button class="btn-confirm-yes" onclick="confirmPermanentDelete()">예 (삭제)</button>
        <button class="btn-confirm-no" onclick="closeConfirmModal()">아니오</button>
      </div>
    </div>
  </div>

  <!-- 로딩 오버레이 -->
  <div id="loading">
    <i class="fa-solid fa-spinner fa-spin fa-2x" style="margin-bottom: 12px;"></i>
    <p id="loadingText">쿠폰 동기화 중...</p>
  </div>

  <script>
    const GROUP_PIN = "1234";

    function checkPin() {
      const input = document.getElementById('pinInput').value;
      if (input === GROUP_PIN) {
        localStorage.setItem('shared_coupon_auth', 'true');
        document.getElementById('authOverlay').style.display = 'none';
      } else {
        alert("비밀번호가 일치하지 않습니다.");
        document.getElementById('pinInput').value = '';
      }
    }

    if (localStorage.getItem('shared_coupon_auth') === 'true') {
      document.getElementById('authOverlay').style.display = 'none';
    }

    document.getElementById('pinInput').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') checkPin();
    });

    const firebaseConfig = {
      apiKey: "AIzaSyDHjSPj9mg1gWf67Ll7lZ_OzQ",
      authDomain: "coopon-b19b4.firebaseapp.com",
      projectId: "coopon-b19b4",
      storageBucket: "coopon-b19b4.firebasestorage.app",
      messagingSenderId: "996971231395",
      appId: "1:996971231395:web:5f7b265ba6c1",
      measurementId: "G-0G3NC1L3ME"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allCoupons = [];
    let selectedCouponId = null;
    let targetDeleteId = null;

    let isZoomed = true;
    let barcodeZoomTransform = 'translate(0px, 0px) scale(1)';

    function getDaysDiff(dateStr) {
      if (!dateStr) return 99999;
      const target = new Date(dateStr);
      const today = new Date();
      target.setHours(0,0,0,0);
      today.setHours(0,0,0,0);
      return Math.ceil((target - today) / (1000 * 60 * 60 * 24));
    }

    // 🌟 강화된 다중 포맷 유효기간 추출 엔진
    function extractDate(text) {
      if (!text) return null;

      // 1. 유효기간/기한 키워드 근처 날짜 탐색 (예: 유효기간 ~ 2026.12.31, 26/08/25 까지)
      const keywordRegex = /(?:유효기간|사용기한|기한|유효|만료일|만료|까지|교환유효)[^\d\r\n]{0,12}(20\d{2}|\d{2})[\s.\-\/년]+(\d{1,2})[\s.\-\/월]+(\d{1,2})/i;
      const keyMatch = text.match(keywordRegex);
      if (keyMatch) {
        let y = keyMatch[1];
        if (y.length === 2) y = '20' + y;
        const m = keyMatch[2].padStart(2, '0');
        const d = keyMatch[3].padStart(2, '0');
        if (parseInt(m) >= 1 && parseInt(m) <= 12 && parseInt(d) >= 1 && parseInt(d) <= 31) {
          return `${y}-${m}-${d}`;
        }
      }

      // 2. 일반 구분자 날짜 탐색 (예: 2026.12.31, 2026-08-30, 26/11/05 등)
      const generalRegex = /(20\d{2}|\d{2})[\s.\-\/년]+(\d{1,2})[\s.\-\/월]+(\d{1,2})/g;
      let match;
      const foundList = [];

      while ((match = generalRegex.exec(text)) !== null) {
        let y = match[1];
        if (y.length === 2) y = '20' + y;
        const m = match[2].padStart(2, '0');
        const d = match[3].padStart(2, '0');
        const mm = parseInt(m), dd = parseInt(d);
        if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
          foundList.push(`${y}-${m}-${d}`);
        }
      }

      // 3. 8자리 연속 숫자 탐색 (예: 20261231)
      const digit8Regex = /(20\d{2})(\d{2})(\d{2})/g;
      while ((match = digit8Regex.exec(text)) !== null) {
        const y = match[1], m = match[2], d = match[3];
        const mm = parseInt(m), dd = parseInt(d);
        if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) {
          foundList.push(`${y}-${m}-${d}`);
        }
      }

      if (foundList.length > 0) {
        return foundList[foundList.length - 1]; // 쿠폰 하단에 적힌 만료일을 우선 채택
      }
      return null;
    }

    function formatDateToShort(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.split('-');
      return `${parts[0].slice(2)}.${parts[1]}.${parts[2]}`;
    }

    function getTodayFormatted() {
      const now = new Date();
      const yy = String(now.getFullYear()).slice(2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yy}.${mm}.${dd}`;
    }

    db.collection("coupons").onSnapshot((snapshot) => {
      allCoupons = [];
      const now = Date.now();
      const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;

      snapshot.forEach((doc) => {
        const data = doc.data();
        if (data.isUsed && data.usedTimestamp && (now - data.usedTimestamp > THIRTY_DAYS_MS)) {
          db.collection("coupons").doc(doc.id).delete();
        } else {
          allCoupons.push({ docId: doc.id, ...data });
        }
      });
      render();
    });

    function render() {
      const grid = document.getElementById('couponGrid');
      const trashGrid = document.getElementById('trashGrid');
      grid.innerHTML = '';
      trashGrid.innerHTML = '';

      const activeCoupons = allCoupons.filter(c => !c.isUsed);
      const usedCoupons = allCoupons.filter(c => c.isUsed);

      activeCoupons.sort((a, b) => getDaysDiff(a.expiryDate) - getDaysDiff(b.expiryDate));
      usedCoupons.sort((a, b) => (b.usedTimestamp || 0) - (a.usedTimestamp || 0));

      activeCoupons.forEach(coupon => {
        const diff = getDaysDiff(coupon.expiryDate);
        const card = document.createElement('div');
        card.className = 'coupon-card';
        card.onclick = () => openDetail(coupon.docId);

        const shortDate = formatDateToShort(coupon.expiryDate);
        let dateDisplay = shortDate ? `${shortDate}까지` : '기한 미정';
        let isUrgent = false;

        if (diff !== 99999 && diff <= 7) {
          isUrgent = true;
          dateDisplay = diff === 0 ? 'D-Day' : (diff > 0 ? `D-${diff}` : '만료');
        }

        card.innerHTML = `
          <div class="card-img-box">
            <img src="${coupon.image}" alt="쿠폰" />
          </div>
          <div class="card-footer">
            <span class="badge-date ${isUrgent ? 'urgent-dday' : ''}">${dateDisplay}</span>
          </div>
        `;
        grid.appendChild(card);
      });

      usedCoupons.forEach(coupon => {
        const item = document.createElement('div');
        item.className = 'coupon-card used';
        
        const usedDateStr = coupon.usedDate || getTodayFormatted();
        const usedTime = coupon.usedTimestamp || Date.now();
        const daysPassed = Math.floor((Date.now() - usedTime) / (1000 * 60 * 60 * 24));
        const daysLeft = Math.max(0, 30 - daysPassed);
        const autoDeleteText = daysLeft === 0 ? "오늘 자동삭제" : `${daysLeft}일 뒤 삭제 🗑️`;

        item.innerHTML = `
          <div class="card-img-box">
            <img src="${coupon.image}" alt="쿠폰" />
            <div class="masking-tape">${usedDateStr} 완료</div>
          </div>
          <div class="card-footer">
            <button class="badge-date-trash" onclick="promptPermanentDelete('${coupon.docId}', event)" title="터치 시 즉시 영구 삭제">
              ${autoDeleteText}
            </button>
            <button class="btn-restore" onclick="restoreCoupon('${coupon.docId}')">복구</button>
          </div>
        `;
        trashGrid.appendChild(item);
      });
    }

    // 🌟 OCR 해상도를 위해 고해상도 보존 압축
    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxDimension = 1600; // 글자 인식을 위해 해상도 상향

            if (width > height && width > maxDimension) {
              height *= maxDimension / width;
              width = maxDimension;
            } else if (height > maxDimension) {
              width *= maxDimension / height;
              height = maxDimension;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.92));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).slice(0, 10);
      if (!files.length) return;

      const loading = document.getElementById('loading');
      const loadingText = document.getElementById('loadingText');
      loading.style.display = 'flex';

      for (let i = 0; i < files.length; i++) {
        loadingText.innerText = `날짜 분석 중... (${i+1}/${files.length})`;
        const base64 = await compressImage(files[i]);
        let extractedDate = null;

        try {
          const result = await Tesseract.recognize(base64, 'kor+eng');
          extractedDate = extractDate(result.data.text);
        } catch (err) {}

        if (!extractedDate) {
          extractedDate = prompt("유효기간을 입력해주세요 (YYYY-MM-DD):", new Date().toISOString().slice(0,10));
        }

        await db.collection("coupons").add({
          image: base64,
          expiryDate: extractedDate,
          isUsed: false,
          createdAt: Date.now()
        });
      }

      loading.style.display = 'none';
      e.target.value = '';
    });

    // 🌟 원본 사진 자체를 줌인하는 좌표/배율 계산
    async function calculatePhotoZoom(imgEl) {
      let box = null;

      if ('BarcodeDetector' in window) {
        try {
          const detector = new BarcodeDetector();
          const barcodes = await detector.detect(imgEl);
          if (barcodes.length > 0) {
            box = barcodes[0].boundingBox;
          }
        } catch (e) {}
      }

      const nw = imgEl.naturalWidth || 800;
      const nh = imgEl.naturalHeight || 1200;

      // 바코드 미감지 시 세로 쿠폰 기준 중앙/하단 영역 타겟
      if (!box) {
        box = {
          x: nw * 0.08,
          y: nh * 0.42,
          width: nw * 0.84,
          height: nh * 0.20
        };
      }

      const vw = window.innerWidth;
      const vh = window.innerHeight;

      // 이미지가 contain된 상태의 스케일
      const baseScale = Math.min(vw / nw, vh / nh);
      const renderedW = nw * baseScale;
      const renderedH = nh * baseScale;

      const barcodeCenterX = (box.x + box.width / 2) * baseScale;
      const barcodeCenterY = (box.y + box.height / 2) * baseScale;
      const barcodeRenderedW = box.width * baseScale;

      // 바코드가 화면 가로폭(vw - 16px)에 꽉 차도록 원본 사진 확대 배율 계산
      const zoomFactor = Math.min(4.5, (vw - 16) / barcodeRenderedW);

      // 사진 중심에서 바코드 중심까지의 이동 거리 계산
      const moveX = ((renderedW / 2) - barcodeCenterX) * zoomFactor;
      const moveY = ((renderedH / 2) - barcodeCenterY) * zoomFactor;

      barcodeZoomTransform = `translate(${moveX}px, ${moveY}px) scale(${zoomFactor})`;
      
      // 사진 자체에 줌인 적용
      isZoomed = true;
      imgEl.style.transform = barcodeZoomTransform;
      document.getElementById('btnToggleView').innerHTML = `<i class="fa-solid fa-image"></i> 원본 전체 보기`;
    }

    function openDetail(id) {
      selectedCouponId = id;
      const coupon = allCoupons.find(c => c.docId === id);
      if (!coupon) return;

      const photo = document.getElementById('modalPhoto');
      photo.style.transform = 'translate(0px, 0px) scale(1)';
      photo.src = coupon.image;

      photo.onload = () => {
        calculatePhotoZoom(photo);
      };

      document.getElementById('detailModal').classList.add('active');
      history.pushState({ modal: 'detail' }, '');
    }

    // 🌟 원본 전체 보기 <-> 사진 바코드 위치로 줌인 토글
    function toggleZoom() {
      const photo = document.getElementById('modalPhoto');
      const btn = document.getElementById('btnToggleView');

      if (isZoomed) {
        // 축소: 원본 사진 전체 보기
        photo.style.transform = 'translate(0px, 0px) scale(1)';
        btn.innerHTML = `<i class="fa-solid fa-barcode"></i> 바코드 줌인`;
        isZoomed = false;
      } else {
        // 확대: 원본 사진을 바코드 위치로 줌인
        photo.style.transform = barcodeZoomTransform;
        btn.innerHTML = `<i class="fa-solid fa-image"></i> 원본 전체 보기`;
        isZoomed = true;
      }
    }

    function closeModal(isHistoryBack = false) {
      const modal = document.getElementById('detailModal');
      if (modal.classList.contains('active')) {
        modal.classList.remove('active');
        selectedCouponId = null;
        document.getElementById('modalPhoto').style.transform = 'translate(0px, 0px) scale(1)';

        if (!isHistoryBack && history.state && history.state.modal === 'detail') {
          history.back();
        }
      }
    }

    window.addEventListener('popstate', () => {
      const modal = document.getElementById('detailModal');
      const trashView = document.getElementById('trashView');
      const confirmModal = document.getElementById('confirmDeleteModal');
      
      if (confirmModal.classList.contains('active')) {
        closeConfirmModal();
      } else if (modal.classList.contains('active')) {
        closeModal(true);
      } else if (trashView.classList.contains('active')) {
        toggleTrashView(true);
      }
    });

    document.getElementById('useCompleteBtn').onclick = async () => {
      if (!selectedCouponId) return;

      await db.collection("coupons").doc(selectedCouponId).update({
        isUsed: true,
        usedDate: getTodayFormatted(),
        usedTimestamp: Date.now()
      });
      closeModal();
    };

    async function restoreCoupon(id) {
      await db.collection("coupons").doc(id).update({
        isUsed: false,
        usedDate: null,
        usedTimestamp: null
      });
    }

    function promptPermanentDelete(id, event) {
      if (event) event.stopPropagation();
      targetDeleteId = id;
      document.getElementById('confirmDeleteModal').classList.add('active');
    }

    function closeConfirmModal() {
      targetDeleteId = null;
      document.getElementById('confirmDeleteModal').classList.remove('active');
    }

    async function confirmPermanentDelete() {
      if (!targetDeleteId) return;
      await db.collection("coupons").doc(targetDeleteId).delete();
      closeConfirmModal();
    }

    function toggleTrashView(isHistoryBack = false) {
      const trashView = document.getElementById('trashView');
      const isActive = trashView.classList.contains('active');
      
      if (!isActive) {
        trashView.classList.add('active');
        history.pushState({ modal: 'trash' }, '');
      } else {
        trashView.classList.remove('active');
        if (!isHistoryBack && history.state && history.state.modal === 'trash') {
          history.back();
        }
      }
    }
    document.getElementById('trashBtn').onclick = () => toggleTrashView();
  </script>
</body>
</html>
